<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ product.title }} | Un Arte Exclusivo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .product-img { width: 100%; max-height: 600px; object-fit: cover; border-radius: 15px; }
        .navbar { background: #212529 !important; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark mb-5">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'index' %}">UN ARTE</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{% url 'gallery' %}">Back to Gallery</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row g-5 align-items-center">
            <div class="col-md-6">
                <img src="{{ product.image }}" class="product-img shadow" alt="{{ product.title }}">
            </div>
            <div class="col-md-6">
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                      <li class="breadcrumb-item"><a href="{% url 'gallery' %}">Gallery</a></li>
                      <li class="breadcrumb-item active">{{ product.title }}</li>
                    </ol>
                </nav>
                <h1 class="display-5 fw-bold">{{ product.title }}</h1>
                <p class="lead text-primary fw-bold fs-3">{{ product.price }}</p>
                <hr>
                <p class="text-muted">{{ product.description }}</p>
                <p class="small text-muted">Includes high-resolution digital download and NFT certificate of authenticity.</p>
                
                <div class="d-grid gap-2 mt-5">
                    <a href="{% url 'checkout' product.id %}" class="btn btn-dark btn-lg">Buy Now</a>
                </div>
            </div>
        </div>
    </div>

    <footer class="py-5 mt-5 border-top text-center text-muted">
        <p>&copy; 2026 Un Arte Exclusivo. All rights reserved.</p>
    </footer>
</body>
</html>
